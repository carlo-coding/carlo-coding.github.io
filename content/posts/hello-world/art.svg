<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <filter id="crayon" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#141414" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g filter="url(#crayon)" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="60" r="34" fill="url(#hatch)"/>
    <circle cx="100" cy="60" r="34"/>
    <ellipse cx="100" cy="60" rx="78" ry="16" transform="rotate(-18 100 60)"/>
    <circle cx="170" cy="36" r="6" fill="#141414"/>
    <path d="M22 24 l4 0 M24 22 l0 4 M170 100 l4 0 M172 98 l0 4"/>
